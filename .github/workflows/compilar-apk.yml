# Compila la app Android en la nube de GitHub (sin instalar Android Studio).
# Sube esta carpeta a un repositorio de GitHub; en la pestaña "Actions" aparece
# "Compilar APK" y, al terminar, el APK se descarga desde "Artifacts".
name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar (debug, instalable directamente)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-IPTV-APK
          path: android/app/build/outputs/apk/debug/*.apk
