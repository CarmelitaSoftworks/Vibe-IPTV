# Compila la app Android en la nube de GitHub (sin instalar Android Studio).
# Builds the Android app in GitHub's cloud (no Android Studio needed).
# Al terminar / When done:
#   - el APK queda en "Artifacts" y en la versión "prueba" de Releases
#     the APK is in "Artifacts" and in the "prueba" (test build) release
#   - si falla, el registro completo se guarda en la rama build-logs
#     if it fails, the full log is saved to the build-logs branch
name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar (debug, instalable directamente)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publicar el APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-IPTV-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publicar versión de prueba (Releases)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Nombres cortos y fijos: fáciles de escribir en Downloader / short fixed names for Downloader
          mkdir -p dist
          d=app/build/outputs/apk/debug
          cp $d/app-armeabi-v7a-debug.apk dist/vibe-iptv-armv7.apk
          cp $d/app-arm64-v8a-debug.apk dist/vibe-iptv-arm64.apk
          cp $d/app-x86_64-debug.apk dist/vibe-iptv-x86_64.apk
          cp $d/app-universal-debug.apk dist/vibe-iptv-universal.apk
          gh release delete prueba --yes --cleanup-tag || true
          gh release create prueba dist/*.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Vibe IPTV — versión de prueba / test build" \
            --notes "Compilación automática de \`${GITHUB_SHA::7}\`. Celular: \`vibe-iptv-arm64.apk\` · TV, Fire TV y TV Box: \`vibe-iptv-armv7.apk\` · Si no sabes: \`vibe-iptv-universal.apk\`. En TV con Downloader escribe: carmelitasoftworks.github.io/Vibe-IPTV/tv · Phone: arm64 · TV/Fire TV/TV box: armv7 · Not sure: universal. Downloader: carmelitasoftworks.github.io/Vibe-IPTV/tv"

      - name: Pruebas / Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee test.log

      - name: Mostrar errores / Show errors
        if: failure()
        run: |
          cat build.log test.log 2>/dev/null | grep -E '^e: |FAILED|expected:' | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          cat build.log test.log 2>/dev/null | grep -A12 'What went wrong' | head -40 || true

      - name: Guardar registro en la rama build-logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cp build.log test.log "$RUNNER_TEMP/logs/" 2>/dev/null || true
          cd "$RUNNER_TEMP/logs"
          { cat build.log test.log 2>/dev/null | grep -E '^e: |FAILED|expected:'; cat build.log test.log 2>/dev/null | grep -A15 'What went wrong'; } > errores.txt || true
          git init -q && git checkout -q -b build-logs
          git add . && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Registro ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-logs
