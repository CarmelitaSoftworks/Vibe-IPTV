# Bloque para nginx (HTTPS con certbot). Ajusta server_name y rutas de certificados.
server {
    listen 443 ssl http2;
    server_name iptv.tudominio.cl;
    ssl_certificate     /etc/letsencrypt/live/iptv.tudominio.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iptv.tudominio.cl/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;          # el video sale en vivo, sin acumular
        proxy_request_buffering off;
        proxy_read_timeout 1h;        # canales en vivo = conexiones largas
    }
}
